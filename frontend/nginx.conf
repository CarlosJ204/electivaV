server {
    listen 80;
    server_name localhost;

    # Sirve los archivos HTML de tu frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirige todo lo que empiece con /api/ hacia el contenedor del backend
    location /api/ {
        proxy_pass http://backend-ci:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
