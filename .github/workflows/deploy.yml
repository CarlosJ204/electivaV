
on:
  push:
    branches:
      - dev_ci_cd
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar comandos SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /root/projects/ElectivaVDiurno/Equipo5/electivaV
            git fetch origin
            git checkout ${{ secrets.DEV_CI_CD }}
            git pull origin ${{ secrets.DEV_CI_CD }}
            git pull --ff-only origin ${{ secrets.DEV_CI_CD }}
           